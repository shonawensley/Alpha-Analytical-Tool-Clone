# Stable Pattern Extractor Weights (AAT9)
#
# These tuning parameters feed the row-level scorer (alpha_analytical/stable/__init__.py)
# and the family post-pass aggregator (alpha_analytical/stable/post_pass_families.py).
# Keep keys stable; regression guards reference this schema.

# Row scoring weights
vertical_coverage_per_row: 2
horizontal_persistence_repeat_bonus: 1   # surfaced as "horizontal_persistence" in UI
mirror_bonus: 1

baseline_straight_bonus: 3
baseline_boxed_bonus: 1

straight_2rows_bonus: 2
straight_3rows_bonus: 4

extra_digit_per_char: 1
single_left_bonus: 4

consensus_full_bonus: 4
stub_consensus_score: 4

hot_level_1_bonus: 1
hot_level_2_bonus: 2

dominant_last_bonus: 3
dominant_pair_bonus: 1
dominant_double3_bonus: 1

min_score_to_highlight: 7   # training profile (Combined baseline)

persistence_set_bonus: 2
persistence_draw_bonus: 1
vtrac_straight_bonus: 2
double_mirror_bonus: 1
consensus_tail_bonus: 2

# Family / aggregation weights
perm_density_per_extra: 1
repeat_count_per_extra: 0.5
vtrac_family_presence: 1
cross_section_triple: 2
progression_across_sets: 1
last_remaining_3v_bonus: 3
consensus_family_bonus: 2
hotzone_family_bonus: 1
doubles_trigger_bonus: 1
hidden3v_bonus: 0.5
persistence_family_set_bonus: 2
persistence_family_draw_bonus: 1

# Compound scoring weights (Packet-2)
compound.set_chain_bonus: 2.0
compound.draw_chain_bonus: 0.5
compound.col1_bonus: 1.0
compound.hot1_bonus: 1.0
compound.hot2_bonus: 2.0
compound.consensus_bonus: 1.0
compound.hidden_core_bonus: 1.0
compound.vtrac_straight_bonus: 0.5
compound.double_mirror_bonus: 0.5
