features:
  cluster_scan:
    min_len: 3
    max_len: 12
  variants_step_ceiling: 3
  box_pair_agree_pairs:
    - "R2-R6"

weights:
  w_exact: 1.0
  w_vtrac: 1.0
  w_drop_exact: 0.55
  w_drop_vtrac: 0.6
  w_family_exact: 0.25
  w_family_vtrac: 0.2
  w_box_family_density: 0.4
  w_dup_bonus: 0.2
  w_residual_purity: -0.3
  w_cols_hit_2: 0.3
  w_cols_hit_3: 0.6
  w_variants_hit_2: 0.3
  w_variants_hit_3: 0.6
  w_method_consensus: 0.2
  w_cluster_echo: 0.1
  w_variant_echo: 0.1
  w_set_echo: 0.1
  w_box_pair_agree: 0.1
  w_drop_run_len_2_3: 0.25
  w_drop_run_len_ge4: -0.1
  w_drop_vtrac_multi_col_early_bonus: 0.2
  w_drop_digit_mode_stable: 0.1
  w_set2_carryover: 0.15
  w_persistence_exact: 0.15
  w_persistence_vtrac: 0.25
  w_vt_only_lane: 0.4
  w_ls2_lane: 0.2
  w_ls_col_42: 0.25
  w_funnel_precol1: 0.2
  w_col_proximity: 0.35
  w_set_progress: 0.2
  w_set_proximity: 0.25
  w_set1_terminal: 0.15

caps:
  dup_bonus_max: 0.4
  density_max: 0.6

gates:
  early_lock: 0.85
  early_unlock: 0.25
  tanh_scale: 4.0

policy:
  combined_auto_run: true
  write_own_vs_combined_delta: "diagnostic"

overlay:
  write_flags: true
  write_detailed_hits_csv: false
  write_html: false
  near_miss_hint: true

diagnostics:
  write_training_steps: true
  write_feature_distributions: false
  write_debug_deltas: false
  write_overlay: false

io:
  out_root_template: "data/outputs/analysis/digit_reduction/{STATE}/analyzer_v2"
  safe_mode: true

outputs:
  write_stacked_html: true

scoring_linear:
  enabled: true
  use_for_top: false
  final_logit_bias: -0.25
  final_logit_scale: 1.0
  thresholds:
    lock: 0.92
    hold: 0.85
  weights:
    w_recency_carryover: 0.20
    w_set_echo: 0.05
    w_variant_echo: 0.05
    w_single_column_rescue: 0.25
    w_vtrac_hot: 0.10
    w_vtrac_local_set: 0.05
    w_mode_own_bonus: 0.10
    w_section_combined_penalty: -0.05
    w_box_family_density: 0.05
    w_dup_bonus: 0.03

scoring_v2:
  enabled: true
  use_for_top: true
  weights:
    recency_bonus: 0.50
    family_persistence: 0.20
    singlecol_rescue: 0.35
    density_min: 0.40
    vhot: 0.15
    late_penalty: 0.30
    extended_cluster_bonus: 0.20
    vtrac_family_rescue: 0.30
  guards:
    boost_exact_match: 0.75
    boost_vtrac_match: 0.35
    min_drop_run_len: 5

lockscore:
  enabled: true
  use_for_top: false
  min_lockscore_to_lock: 0.85
  weights:
    w_score_raw: 1.00
    w_earliest_exact: 0.40
    w_earliest_vtrac: 0.30
    w_persistence: 0.35
    w_box_density: 0.25
    w_set_echo: 0.20
    w_variant_echo: 0.10
    w_recency: 0.25
    w_vtrac_hot: 0.20
    w_single_col_rescue: 0.60
    w_double_guard: 0.10
    w_extended_cluster: 0.30
  guards:
    t_early: 3
    t_cols_hit_rescue: 1
    penalty_combined_bias: 0.10
    min_drop_run_len: 5
