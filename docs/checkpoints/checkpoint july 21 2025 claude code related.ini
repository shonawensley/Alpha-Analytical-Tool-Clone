Never modifies: docs/AAT9_DOCS/ unless explicitly instructed

🛠️ CRITICAL TECHNICAL ADDITIONS (AI MUST USE THESE)
Pre-commit Hooks - AUTOMATIC CODE QUALITY
File: .pre-commit-config.yaml
What it does: Automatically formats and checks Python code EVERY time you commit
AI Instructions:
yaml# This runs automatically, but AI should know:
# - Black: Auto-formats Python code to standard style
# - Ruff: Catches Python errors and style issues
# - Runs on EVERY commit - no action needed
# - To skip temporarily: git commit --no-verify
Why this matters:

No more manual formatting
Consistent code style across entire project
Catches errors BEFORE they're committed
Saves hours of code review time

How AI Should Use Pre-commit:

Just commit normally - hooks run automatically
If commit fails - Read the error, fix it, try again
Never disable permanently - Use --no-verify only for WIP commits

backlog CLI integration
Command: backlog "Task description"
Creates: tasks/task_XXXX.md files
AI Usage:
bash# Start EVERY new feature with:
backlog "Build [feature name]"

# This creates a structured task file
# AI then opens and plans inside it
Git Tags - CHECKPOINT EVERYTHING
Why critical: Every working state gets a permanent bookmark
AI Must:
bash# After EVERY successful feature:
git tag v1.X-feature-name
git push --tags

# This creates rollback points
# NEVER skip this step
The Snippet Registry - POWER TOOLS
Location: docs/CLAUDE_CODE/CLAUDE.md
How it works:

AI reads this EVERY session
Tells AI when to load heavy prompts
Prevents token waste

AI Behavior:
markdown# When user says "review this code"
# → AI automatically runs: /open docs/CLAUDE_CODE/prompt_snippets/Dev_Companion.md

# When task involves >2 files or >150 LOC
# → AI automatically runs: /open docs/CLAUDE_CODE/prompt_snippets/CodeFarm_v9.md

# After task completes
# → AI runs: /forget [filename] to free tokens
Directory Structure - WHERE EVERYTHING LIVES
AI Must Remember:

docs/AAT9_DOCS/ = Project history (read-only unless instructed)
docs/CLAUDE_CODE/ = AI's operating manual (read every session)
tasks/ = Active work (AI updates constantly)
modules/ = Actual code (AI's main work area)

Critical Commands for AI
bash# These commands MUST be used:
/clear          # Between EVERY major task
/open [file]    # Load specific prompts/docs
/forget [file]  # Release memory after use
/commit         # Triggers security audit
git tag vX.X    # After every feature
💡 Key Insights & Best Practices
Token Management

Claude.ai (this chat) and Claude Code share the same token pool
Use /clear frequently in Claude Code to reset context
Don't duplicate conversations between tools
Let the snippet registry handle heavy prompts automatically

Workflow Optimization

Link, don't paste - Reference checkpoint files rather than copying content
Progressive disclosure - Start with minimal context, add only as needed
Commit frequently - Every green test gets a commit
Tag milestones - Create rollback points before major changes

Common Pitfalls Avoided

❌ Loading all documentation every session
❌ Mixing workflow rules with project documentation
❌ Creating massive, monolithic prompt files
❌ Forgetting to /clear between tasks

⚠️ WORKFLOW AUTOMATION DETAILS
What Happens Automatically (AI Needs to Know)

On Every Commit:

Black reformats all Python files
Ruff checks for errors
Security audit prompt runs
If any fail, commit is blocked


On Task Start:

CLAUDE.md loads automatically
Snippet registry activates
Previous context clears


During Development:

Heavy prompts load based on triggers
TODO checkboxes update in real-time
Learning summaries append to task files



