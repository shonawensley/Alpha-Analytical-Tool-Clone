🚦 The 7-Rule Operating System
Located in docs/CLAUDE_CODE/CLAUDE.md:

Think first – Scan code & docs; draft checkbox plan in tasks/todo.md
Plan review – Wait for "Approved" before coding
Iterate small – One TODO at a time; summarize each change
Security check – Run Security-Audit Prompt before /commit
Learning recap – Run Learning Prompt after successful /commit
Keep it simple & undoable – No big-bang refactors
Wrap-up – Append Review section to todo.md

Supporting Prompts

Security-Audit: "Audit staged diff for leaked secrets, unsafe input handling..."
Learning: "Explain what this commit adds, why, and how a junior dev can extend it"


