#!/usr/bin/env python
"""
clean_and_view_3.py
Cleans and normalizes Pick3statsC4t.xlsm OntarioCanada4 sheet data
"""
import os
import pandas as pd

def clean_excel_file(input_path, output_path, sheet_name="OntarioCanada4"):
    # Read the Excel file
    print(f"Reading file: {input_path}")
    df = pd.read_excel(input_path, sheet_name=sheet_name, dtype=str)
    
    # Define columns to keep (removing 'Unnamed' columns and other unnecessary ones)
    columns_to_keep = [
        'Q', 'S',  # Midday indicators and draws
        'V', 'W', 'X', 'Y', 'Z', 'AA', 'AB',  # Midday data
        'AD', 'AF',  # Evening indicators
        'AI', 'AJ', 'AK', 'AL', 'AM', 'AN', 'AO',  # Evening data
        'BD',  # Combined indicators
        'BI', 'BJ', 'BK', 'BL', 'BM', 'BN', 'BO'  # Combined data
    ]
    
    # Verify which columns exist
    available_cols = df.columns.tolist()
    print("\nAvailable columns in Excel file:")
    print(available_cols)
    
    # Filter to only existing columns from our list
    existing_columns = [col for col in columns_to_keep if col in available_cols]
    
    if not existing_columns:
        print("\nError: None of the required columns were found in the Excel file")
        return
        
    print("\nKeeping these columns:", existing_columns)
    
    # Create cleaned dataframe with only necessary columns
    cleaned_df = df[existing_columns]
    
    # Clean the data:
    # 1. Remove any extra whitespace
    # 2. Replace NaN with empty string
    # 3. Ensure numbers are formatted properly (no scientific notation)
    cleaned_df = cleaned_df.applymap(lambda x: str(x).strip() if pd.notnull(x) else '')
    
    # Create output directory if it doesn't exist
    os.makedirs(os.path.dirname(output_path), exist_ok=True)
    
    # Save the cleaned file
    cleaned_df.to_excel(output_path, index=False)
    print(f"\nCleaned file saved to: {output_path}")
    print("First few rows of cleaned data:")
    print(cleaned_df.head())

def main():
    # Get the current script's directory
    current_dir = os.path.dirname(os.path.abspath(__file__))
    
    # Navigate to project root and construct paths
    project_root = os.path.abspath(os.path.join(current_dir, '..', '..'))
    
    input_path = os.path.join(project_root, 'data', 'original', 'Pick3StatsC4t.xlsm')
    output_path = os.path.join(project_root, 'data', 'cleaned', 'OntarioCanada4_cleaned.xlsx')
    
    print("\nProject paths:")
    print(f"Project root: {project_root}")
    print(f"Input path: {input_path}")
    print(f"Output path: {output_path}")
    
    # Check if input file exists
    if not os.path.exists(input_path):
        print(f"\nError: Input file not found at {input_path}")
        return
        
    clean_excel_file(input_path, output_path)

if __name__ == "__main__":
    main() 

