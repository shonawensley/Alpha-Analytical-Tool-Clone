## 3. Detailed Process Flow

### Step 1: Data Cleaning
**Script**: `clean_all_states.py`

**Purpose**: Transform raw Excel data into cleaned, normalized state files

**Process Details**:
1. Read source Excel file (Pick3StatsC4t.xlsm)
2. For each state sheet:
   - Remove unnecessary columns
   - Clean and normalize data formats
   - Handle missing values
   - Validate data integrity
3. Save individual cleaned state files

**Key Columns**:
- Midday indicators and draws (Q, S)
- Midday data (V-AB)
- Evening indicators (AD, AF)
- Evening data (AI-AO)
- Combined indicators (BD)
- Combined data (BI-BO)

### Step 2: Data Extraction
**Script**: `extract_datasets_5.py`

**Purpose**: Extract structured data from cleaned files

**Data Structure**:
python
{
"Midday": {
"Set3": {
"Draw1": {
"draw_data": [...],
"R2": [...],
"R4": [...],
"R6": [...],
"R8": [...]
}
},
"Set2": {...},
"Set1": {...}
},
"Evening": {...},
"Combined": {...}
}

**Process Details**:
1. Load cleaned state Excel file
2. Extract sections:
   - Midday
   - Evening
   - Combined
3. Process sets:
   - Set3 (single draw)
   - Set2 (single draw)
   - Set1 (7 draws)
4. Extract row types:
   - DRAW_DATA
   - R2/R4/R6/R8 rows

### Step 3: Table Generation
**Script**: `final_simplified.py`

**Purpose**: Generate formatted analysis tables

**Table Types**:
1. Combined Tables
   - All data (DRAW_DATA, R2, R4, R6, R8)
   - Left-aligned format
   - Complete row information

2. R2-only Tables
   - Custom slicing rules:
     - Set3/Draw1: First 3 items
     - Set2/Draw1: First 3 items
     - Set1/Draw1: First 3 items
     - Set1/Draw2: First 2 items
     - Set1/Draw3-7: First 1 item

**Output Format**:
+-------+--------+-----------+-------+-----+-----+-----+
| Set | Draw | RowType | 7 | 6 | 5 | ... |
+=======+========+===========+=======+=====+=====+=====+
| Set3 | Draw1 | DRAW_DATA | 350 | 036 | 059 | ... |
| Set3 | Draw1 | R2 | 92244 | ... | ... | ... |
...

### Step 4: Visualization
**Script**: `streamlit_viewer.py`

**Purpose**: Interactive viewing of generated tables

**Features**:
1. State Selection
   - Dropdown of all 17 states
   - Auto-loading of selected state data

2. Table Views
   - Combined table view
   - R2-only table view
   - Toggle between sections

3. Display Options
   - Pattern highlighting
   - Custom formatting
   - Data filtering

