#!/usr/bin/env python
"""
streamlit_viewer.py - Streamlit app for viewing state lottery tables
"""

import os
import streamlit as st
from extract_datasets_5 import LotteryDataExtractor
from final_simplified import (
    build_section_table_simple,
    build_r2_only_table_simple
)

# List of states (excluding Georgia and West Virginia)
STATES = [
    "Connecticut4", "Delaware4", "Florida4", "Indiana4",
    "Michigan4", "NewJersey4", "NewYork4", "NorthCarolina4", "Ohio4",
    "OntarioCanada4", "Pennsylvania4", "PuertoRico4", "SouthCarolina4", 
    "TriState4", "Virginia4"
]

def load_state_data(state_name, excel_path):
    """Load data for a single state"""
    try:
        extractor = LotteryDataExtractor(excel_path)
        return extractor.extract_all()
    except Exception as e:
        st.error(f"Error loading {state_name}: {str(e)}")
        return None

def main():
    st.set_page_config(page_title="Lottery Data Viewer", layout="wide")
    
    st.title("Multi-State Lottery Data Viewer")
    
    # Get path to cleaned files
    current_dir = os.path.dirname(os.path.abspath(__file__))
    project_root = os.path.abspath(os.path.join(current_dir, '..', '..'))
    cleaned_dir = os.path.join(project_root, 'data', 'cleaned')
    
    # State selection
    state = st.selectbox(
        "Select a State",
        STATES,
        format_func=lambda x: x.replace("4", "")  # Remove "4" from display
    )
    
    # Section selection
    section = st.radio(
        "Select Section",
        ["Midday", "Evening", "Combined"],
        horizontal=True
    )
    
    # Table type selection
    table_type = st.radio(
        "Select Table Type",
        ["Combined Table", "R2-only Table"],
        horizontal=True
    )
    
    # Load and display data
    excel_path = os.path.join(cleaned_dir, f"{state}_cleaned.xlsx")
    if os.path.exists(excel_path):
        state_data = load_state_data(state, excel_path)
        
        if state_data and section in state_data:
            section_data = state_data[section]
            
            st.subheader(f"{state.replace('4', '')} - {section} - {table_type}")
            
            if table_type == "Combined Table":
                df = build_section_table_simple(section_data)
            else:  # R2-only Table
                df = build_r2_only_table_simple(section_data)
            
            # Display the table
            st.dataframe(
                df,
                use_container_width=True,
                hide_index=True
            )
            
            # Add download button
            csv = df.to_csv(index=False)
            st.download_button(
                "Download as CSV",
                csv,
                f"{state}_{section}_{table_type}.csv",
                "text/csv",
                key='download-csv'
            )
        else:
            st.warning(f"No data found for {section} section")
    else:
        st.error(f"Cleaned file not found: {excel_path}")

if __name__ == "__main__":
    main() 
