# Multi-State Lottery Data Processing System

## Overview
A comprehensive system for processing and visualizing lottery data from multiple states. The system:
1. Cleans raw Excel data sheets
2. Extracts structured datasets
3. Generates formatted tables with specific rules:
   - Right-aligned data with "N/A" padding
   - Hot zone marking (with "*") for Set1 patterns
   - Custom R2 data slicing
4. Provides a web interface for viewing and downloading tables

## Supported States
The system processes data from 17 states/regions:
- Connecticut
- Delaware
- Florida
- Georgia
- Indiana
- Michigan
- New Jersey
- New York
- North Carolina
- Ohio
- Ontario Canada
- Pennsylvania
- Puerto Rico
- South Carolina
- TriState
- Virginia
- West Virginia



